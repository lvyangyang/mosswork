name: Canonical product checks
description: Run reviewed MCP, canonical business and chat admission regressions.
runs:
  using: composite
  steps:
    - name: Select fresh Windows functional fixture storage
      id: functional_fixture_storage
      if: runner.os == 'Windows'
      shell: bash
      run: |
        uv run --frozen python - <<'PY'
        from pathlib import Path
        import json
        import os
        import sys
        import tempfile
        import shlex
        system = Path(tempfile.gettempdir()).resolve()
        runner = Path(os.environ["RUNNER_TEMP"]).resolve(strict=True)
        assert runner.is_dir() and "\n" not in str(runner) and "\r" not in str(runner)
        explicit = any(arg == "--basetemp" or arg.startswith("--basetemp=") for arg in shlex.split(os.environ.get("PYTEST_ADDOPTS", "")))
        base = tempfile.mkdtemp(prefix="mosswork-functional-", dir=runner) if sys.platform == "win32" and not explicit and runner.drive.casefold() != system.drive.casefold() else ""
        record = dict(system_temp=str(system), runner_temp=str(runner), fresh_fixture_parent=base, existing_explicit_basetemp=explicit, scope="new functional pytest directories only; no global environment or performance-leg change")
        (runner / "functional-fixture-storage.json").write_text(json.dumps(record, indent=2) + "\n", encoding="utf-8")
        with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
            output.write("base=" + base.replace("\\", "/") + "\n")
        print("CI_FIXTURE_STORAGE: " + json.dumps(record))
        PY
    - name: Check retained reviewed registrations and current product ports
      shell: bash
      run: |
        uv run --frozen ruff check src/octop/infra/db/repos/retained_mcp.py src/octop/infra/native_host/reviewed_mcp.py tests/unit/native_host/test_reviewed_mcp.py tests/unit/native_host/test_registered_mcp_composition.py
        uv run --frozen ruff format --check src/octop/infra/db/repos/retained_mcp.py src/octop/infra/native_host/reviewed_mcp.py tests/unit/native_host/test_reviewed_mcp.py tests/unit/native_host/test_registered_mcp_composition.py
        uv run --frozen mypy --strict --follow-imports=silent src/octop/infra/db/repos/retained_mcp.py src/octop/infra/native_host/reviewed_mcp.py
        fixture_args=()
        if [[ -n "${{ steps.functional_fixture_storage.outputs.base }}" ]]; then
          fixture_args=(--basetemp "${{ steps.functional_fixture_storage.outputs.base }}/cohort-1")
        fi
        uv run --frozen pytest -n "2" tests/unit/native_host/test_reviewed_mcp.py tests/unit/native_host/test_registered_mcp_composition.py -q \
          --junitxml "$RUNNER_TEMP/reviewed-mcp.xml" "${fixture_args[@]}"
    - name: Check canonical business, current member writes and same-instance composition
      shell: bash
      run: |
        fixture_args=()
        if [[ -n "${{ steps.functional_fixture_storage.outputs.base }}" ]]; then
          fixture_args=(--basetemp "${{ steps.functional_fixture_storage.outputs.base }}/cohort-2")
        fi
        uv run --frozen pytest -n "2" tests/unit/identity tests/unit/gateway/test_canonical_feishu.py tests/unit/gateway/test_feishu_delivery_business_store.py tests/unit/auth/test_feishu_adapter.py tests/unit/api/test_canonical_request_dependency.py tests/unit/test_canonical_business_product_composition.py tests/unit/test_canonical_business_supplements_consumer.py tests/unit/test_canonical_product_startup.py tests/unit/test_r26_pc3_sms_mount.py tests/unit/db/test_canonical_identity_projection.py tests/unit/i18n -q --junitxml "$RUNNER_TEMP/canonical-business.xml" "${fixture_args[@]}"
    - name: Check canonical chat and original actor admission
      shell: bash
      run: |
        fixture_args=()
        if [[ -n "${{ steps.functional_fixture_storage.outputs.base }}" ]]; then
          fixture_args=(--basetemp "${{ steps.functional_fixture_storage.outputs.base }}/cohort-3")
        fi
        uv run --frozen pytest -n "2" tests/unit/api/test_canonical_chat_websocket.py tests/unit/api/test_canonical_websocket_principal.py tests/unit/test_canonical_execution_admission.py tests/unit/test_canonical_queue_reauthentication.py tests/unit/test_canonical_execution_reauthentication_http.py tests/unit/agents/test_managed_lifecycle_admission.py -q --junitxml "$RUNNER_TEMP/canonical-chat-admission.xml" "${fixture_args[@]}"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: canonical-product-receipts-${{ runner.os }}
        path: |
          ${{ runner.temp }}/reviewed-mcp.xml
          ${{ runner.temp }}/canonical-business.xml
          ${{ runner.temp }}/canonical-chat-admission.xml
          ${{ runner.temp }}/functional-fixture-storage.json
        if-no-files-found: ignore
